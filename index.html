<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="/manifest.json">
<title>AI 助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<style>
:root{--accent:#d4a574;--bubble-alpha:.6;--header-alpha:.35;--footer-alpha:.7;--bubble-radius:20px;--font-size-base:15px;--left-bubble-color:45,45,48;--right-bubble-color:184,125,75;--bg-color:#f5f6f8;--bg-color-rgb:245,246,248;--text-color:#1c1c1e;--text-dim:#8e8e93;--input-bg:rgba(255,255,255,.4);--border-color:rgba(255,255,255,.25);--toast-bg:rgba(255,255,255,.85);--toast-text:#1c1c1e;--modal-bg:rgba(255,255,255,.95);--modal-text:#1c1c1e;--modal-label:#8e8e93;--modal-input-bg:rgba(0,0,0,.05);--time-bg:rgba(0,0,0,.06);--time-text:#8e8e93}
[data-theme="dark"]{--bg-color:#0a0a0c;--bg-color-rgb:10,10,12;--text-color:#ececec;--text-dim:#8a8a8e;--input-bg:rgba(255,255,255,.08);--border-color:rgba(255,255,255,.15);--toast-bg:rgba(45,45,48,.85);--toast-text:#fff;--modal-bg:rgba(28,28,30,.98);--modal-text:#fff;--modal-label:#8a8a8e;--modal-input-bg:rgba(255,255,255,.05);--time-bg:rgba(255,255,255,.1);--time-text:#8a8a8e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg-color)}
body{color:var(--text-color);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--font-size-base);display:flex;flex-direction:column;animation:fadeIn 1.2s ease-in-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:absolute;top:0;left:0;right:0;z-index:100;padding-top:max(16px,env(safe-area-inset-top));background:rgba(var(--bg-color-rgb),var(--header-alpha));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid rgba(255,255,255,.15)}
.header-btn{background:transparent;border:none;color:var(--text-color);font-size:22px;cursor:pointer;padding:4px 8px;opacity:.8}
.header-title{font-size:16px;font-weight:600;flex:1;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.header-title .arrow{font-size:11px;opacity:.6}
.toast-container{position:fixed;top:80px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:200;pointer-events:none}
.toast{background:var(--toast-bg);color:var(--toast-text);padding:10px 16px;border-radius:24px;font-size:14px;max-width:80%;word-break:break-all;box-shadow:0 10px 30px rgba(0,0,0,.25);border:.5px solid var(--border-color);backdrop-filter:blur(24px) saturate(180%);animation:slideDown .4s,fadeOut .4s ease 3.6s forwards;display:flex;align-items:center;gap:8px}
.toast img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.toast .toast-name{color:var(--accent);font-weight:600;font-size:12px;white-space:nowrap}
@keyframes slideDown{from{opacity:0;transform:translateY(-30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-15px)}}
.chat-area{flex:1;overflow-y:auto;padding:80px 16px 160px 16px;display:flex;flex-direction:column;gap:16px;background-color:var(--bg-color);background-size:cover;background-position:center;background-repeat:no-repeat}
.chat-area::-webkit-scrollbar{width:4px}.chat-area::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:2px}
.time-capsule{align-self:center;background:var(--time-bg);color:var(--time-text);font-size:12px;padding:4px 12px;border-radius:12px;margin:8px 0;backdrop-filter:blur(10px)}
.system-msg{text-align:center;font-size:13px;color:var(--text-dim);margin-top:20px}
.msg-row{display:flex;gap:12px;max-width:85%;animation:popIn .4s cubic-bezier(.175,.885,.32,1.275) !important}
.msg-row.left{align-self:flex-start}
.msg-row.right{align-self:flex-end;flex-direction:row-reverse}
@keyframes popIn{0%{opacity:0;transform:scale(.9) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:rgba(128,128,128,.2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-color);overflow:hidden;border:1px solid var(--border-color);cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble-wrapper{display:flex;flex-direction:column;max-width:100%}
.msg-row.left .bubble-wrapper{align-items:flex-start}.msg-row.right .bubble-wrapper{align-items:flex-end}

/* Markdown 核心样式 */
.bubble{position:relative;padding:12px 16px;border-radius:var(--bubble-radius);font-size:var(--font-size-base);line-height:1.5;max-width:100%;width:fit-content;transition:all .3s;overflow:hidden;word-break:break-word;}
.bubble p{margin-bottom:8px;} .bubble p:last-child{margin-bottom:0;}
.bubble pre{background:#282c34;border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0;position:relative;}
.bubble code{font-family:monospace;font-size:13px;}
.bubble pre code{background:transparent;padding:0;color:#abb2bf;}
.bubble table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;}
.bubble th,.bubble td{border:1px solid var(--border-color);padding:6px;text-align:left;}
.bubble th{background:rgba(0,0,0,.1);}
.copy-code-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;cursor:pointer;}
.copy-code-btn:active{background:rgba(255,255,255,.3);}

.bubble::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(to right,rgba(255,255,255,0),rgba(255,255,255,.15),rgba(255,255,255,0));transform:skewX(-25deg);display:none}
[data-bubble-style="liquid"] .bubble::after{display:block;animation:liquidShine 5s infinite linear}
[data-bubble-style="glass"] .bubble::after,[data-bubble-style="solid"] .bubble::after{display:none!important}
@keyframes liquidShine{0%{left:-100%}15%{left:200%}100%{left:200%}}
[data-bubble-style="liquid"] .bubble{backdrop-filter:blur(24px) saturate(180%);border:.5px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 8px 32px rgba(0,0,0,.15)}
[data-bubble-style="glass"] .bubble{backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.18);box-shadow:0 4px 20px rgba(0,0,0,.15)}
.msg-row.left .bubble{background:rgba(var(--left-bubble-color),var(--bubble-alpha));color:var(--text-color);border-top-left-radius:6px}
.msg-row.right .bubble{background:rgba(var(--right-bubble-color),var(--bubble-alpha));color:#fff;border-top-right-radius:6px}
.msg-actions{display:none;gap:6px;margin-top:6px;flex-wrap:wrap;}
.msg-row:hover .msg-actions{display:flex}
.msg-actions button{font-size:11px;padding:3px 8px;border-radius:8px;border:.5px solid var(--border-color);background:var(--input-bg);color:var(--text-color);cursor:pointer;}
.footer{display:flex;flex-direction:column;gap:8px;padding:12px 16px;position:absolute;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(to top,rgba(var(--bg-color-rgb),.8) 0%,transparent 100%);backdrop-filter:blur(10px);padding-bottom:max(16px,env(safe-area-inset-bottom));pointer-events:none}
.footer>*{pointer-events:auto}
.status-bar{display:none;text-align:center;font-size:12px;color:var(--accent);background:rgba(var(--right-bubble-color),.15);padding:6px 14px;border-radius:16px;margin:0 auto 4px auto;width:fit-content;align-items:center;gap:6px;backdrop-filter:blur(10px)}
.status-bar.show{display:flex}
.dot{width:5px;height:5px;background-color:var(--accent);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.dot:nth-child(1){animation-delay:-.32s}.dot:nth-child(2){animation-delay:-.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.action-row{display:flex;gap:8px;justify-content:space-between;overflow-x:auto;padding-bottom:4px;}
.action-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(var(--bg-color-rgb),.4);border:.5px solid rgba(255,255,255,.2);color:var(--text-color);padding:10px 0;border-radius:16px;font-size:13px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(20px) saturate(180%);position:relative}
.action-btn.active{background:rgba(var(--right-bubble-color),.3);border-color:var(--accent);color:var(--accent)}
.input-row{display:flex;align-items:center;gap:10px}
.my-avatar-small{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:rgba(128,128,128,.2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-color);overflow:hidden;border:1px solid var(--border-color)}
.my-avatar-small img{width:100%;height:100%;object-fit:cover}
.input-box{flex:1;display:flex;align-items:center;background:rgba(var(--bg-color-rgb),.3);border:.5px solid rgba(255,255,255,.25);border-radius:22px;padding:4px 6px 4px 12px;backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 4px 20px rgba(0,0,0,.15)}
.input-box input[type="text"]{flex:1;background:transparent;border:none;color:var(--text-color);font-size:var(--font-size-base);outline:none;font-family:inherit;padding:8px 0}
.input-box input[type="text"]::placeholder{color:var(--text-dim)}
.send-btn{background:var(--accent);color:#fff;border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;box-shadow:0 4px 12px rgba(212,165,116,.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
.modal.show{display:flex;opacity:1}
.modal-content{background:var(--modal-bg);color:var(--modal-text);width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;border-radius:28px 28px 0 0;padding:24px 20px;padding-bottom:max(24px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s;backdrop-filter:blur(30px) saturate(180%);border-top:.5px solid rgba(255,255,255,.2)}
.modal.show .modal-content{transform:translateY(0)}
.modal-content h2{font-size:20px;font-weight:700;margin-bottom:20px;text-align:center}
.modal-content label{display:block;font-size:13px;color:var(--modal-label);margin-bottom:16px;font-weight:500}
.modal-content input[type="text"],.modal-content input[type="password"],.modal-content input[type="number"],.modal-content select,.modal-content textarea{width:100%;background:var(--modal-input-bg);border:.5px solid var(--border-color);color:var(--modal-text);padding:12px 16px;border-radius:14px;font-size:15px;margin-top:8px;outline:none;font-family:inherit;-webkit-appearance:none}
.modal-content textarea{line-height:1.5;resize:vertical}
.row{display:flex;gap:12px}.row label{flex:1}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--modal-input-bg);padding:12px 16px;border-radius:14px;margin-bottom:16px;border:.5px solid var(--border-color)}
.switch{position:relative;display:inline-block;width:44px;height:24px}.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.4s;border-radius:24px}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.4s;border-radius:50%}
input:checked+.slider{background-color:var(--accent)}input:checked+.slider:before{transform:translateX(20px)}
.color-row{display:flex;gap:12px;margin-bottom:16px}
.color-row label{flex:1;margin-bottom:0;display:flex;flex-direction:column;align-items:center;background:var(--modal-input-bg);padding:10px;border-radius:14px;border:.5px solid var(--border-color)}
.color-row input[type="color"]{-webkit-appearance:none;border:none;width:100%;height:36px;border-radius:10px;cursor:pointer;margin-top:8px;background:transparent}
.color-row input[type="color"]::-webkit-color-swatch{border:none;border-radius:10px}
.modal-actions{display:flex;gap:12px;margin-top:10px}.modal-actions button{flex:1;padding:14px;border-radius:16px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:var(--modal-input-bg);color:var(--modal-text)}
.btn-danger{width:100%;padding:14px;margin-top:12px;background:transparent;color:#ff453a;border:.5px solid rgba(255,69,58,.3);border-radius:16px;font-size:14px;cursor:pointer;font-family:inherit}
input[type="range"]{-webkit-appearance:none;width:100%;height:6px;background:var(--modal-input-bg);border-radius:3px;outline:none;margin-top:10px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.game-panel{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:400;backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%)}
.game-panel.show{display:flex}
.game-panel-inner{background:var(--modal-bg);color:var(--modal-text);width:92%;max-width:460px;border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:88dvh;overflow-y:auto;position:relative;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:.5px solid rgba(255,255,255,.2)}
.game-chat-area{max-height:120px;overflow-y:auto;margin-top:12px;padding:10px 14px;background:var(--modal-input-bg);border-radius:14px;font-size:13px;line-height:1.5;border:.5px solid var(--border-color)}
.game-chat-area .game-chat-msg{margin-bottom:6px}
.game-chat-area .game-chat-msg:last-child{margin-bottom:0}
.game-chat-area .game-chat-name{color:var(--accent);font-weight:600;margin-right:4px}
.q-avatar-box{text-align:center;margin-bottom:12px}
.q-avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.6);box-shadow:0 8px 20px rgba(0,0,0,.1);animation:float 2s ease-in-out infinite}
@keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(2deg)}100%{transform:translateY(0) rotate(0)}}
.game-panel h3{text-align:center;font-size:18px;margin-bottom:12px}
.game-panel .game-hint{text-align:center;font-size:13px;color:var(--modal-label);margin-bottom:16px}
.game-area{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.game-btn{padding:10px 20px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.game-btn.secondary{background:var(--modal-input-bg);color:var(--modal-text)}
.game-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.game-card{background:var(--modal-input-bg);border:1px solid var(--border-color);border-radius:14px;padding:14px;text-align:center;cursor:pointer;flex:1;min-width:42%}
.game-card .icon{font-size:28px}.game-card .name{font-size:14px;font-weight:600;margin-top:6px}
.board{display:grid;gap:2px;background:var(--border-color);padding:2px;border-radius:8px;margin:0 auto}
.board-cell{background:var(--modal-bg);aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.board-cell:hover{background:rgba(var(--right-bubble-color),.1)}
.monopoly-board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%}
.monopoly-cell{background:var(--modal-input-bg);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:6px;text-align:center;padding:4px}
.monopoly-cell.active{background:var(--accent);color:#fff}
.mem-item{background:var(--modal-input-bg);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.mem-item .mem-del{color:#ff453a;cursor:pointer;padding:0 4px}
.bubble.glow-red{box-shadow:0 0 15px rgba(255,69,58,.6)!important;border:1px solid rgba(255,69,58,.4)!important;animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bubble.glow-pink{box-shadow:0 0 20px rgba(255,105,180,.6)!important;border:1px solid rgba(255,105,180,.4)!important}
.meteor-shower-container{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;background:transparent;transform:translateZ(0);will-change:transform;contain:strict;backface-visibility:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;box-shadow:0 0 8px #fff,0 0 16px rgba(180,210,255,.8);animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.4)}}
.meteor{position:absolute;background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.3) 50%, rgba(255,255,255,.9) 100%);border-radius:999px;box-shadow:0 0 10px rgba(255,255,255,.8),0 0 20px rgba(180,210,255,.5);opacity:0;transform-origin:top right;animation:meteorFall linear forwards;will-change:transform}
.meteor::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:0 0 15px #fff,0 0 30px #fff,0 0 50px rgba(200,220,255,.8)}
@keyframes meteorFall{0%{transform:translate(0,0) rotate(45deg);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translate(-70vw,200vh) rotate(45deg);opacity:0}}
.heart-draw{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:250px;height:250px;pointer-events:none;z-index:9999;filter:drop-shadow(0 0 15px rgba(255,50,150,.8));opacity:0;transition:opacity .3s}
.heart-draw.show{opacity:1}
.heart-draw .heart-path{fill:none;stroke:#ff3399;stroke-width:4;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:drawHeart 1.5s ease-in-out forwards}
@keyframes drawHeart{to{stroke-dashoffset:0}}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;backdrop-filter:blur(4px)}
.sidebar-overlay.show{display:block}
.sidebar{position:fixed;top:0;left:-320px;width:300px;height:100%;background:var(--modal-bg);color:var(--modal-text);z-index:501;transition:left .3s ease;display:flex;flex-direction:column;padding:16px 12px;padding-top:max(16px,env(safe-area-inset-top));border-right:.5px solid rgba(255,255,255,.1);backdrop-filter:blur(30px) saturate(180%)}
.sidebar.show{left:0}
.sidebar h2{font-size:17px;font-weight:700;margin-bottom:14px;padding-left:8px}
.sidebar .session-list{flex:1;overflow-y:auto}
.sidebar .session-item{padding:10px 12px;border-radius:12px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;transition:background .2s}
.sidebar .session-item:hover{background:rgba(128,128,128,.15)}
.sidebar .session-item.active{background:rgba(var(--right-bubble-color),.25);color:var(--accent);font-weight:600}
.sidebar .session-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar .session-item .del{color:#ff453a;padding:0 6px;font-size:12px}
.sidebar .new-session-btn{width:100%;padding:12px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:14px;margin-top:10px;cursor:pointer}
</style>
</head>
<body data-theme="dark">

<header class="header">
  <div style="display:flex;gap:2px">
    <button class="header-btn" id="sidebarBtn">☰</button>
    <button class="header-btn" id="closeBtn">✕</button>
  </div>
  <div class="header-title" id="headerTitle"><span class="name">AI 助手</span> <span class="arrow">▼</span></div>
  <div style="display:flex;gap:2px">
    <button class="header-btn" id="exportChatBtn" title="导出记录">📤</button>
    <button class="header-btn" id="newChatBtn" title="新建对话">➕</button>
    <button class="header-btn" id="menuBtn">···</button>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <h2>💬 历史会话</h2>
  <div class="session-list" id="sessionList"></div>
  <button class="new-session-btn" id="newSessionBtn">＋ 新建对话</button>
</div>

<div class="toast-container" id="toastContainer"></div>
<main class="chat-area" id="chatArea"></main>

<footer class="footer">
  <div class="status-bar" id="statusBar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>正在思考...</div>
  
  <div class="action-row" style="gap:6px;">
    <button class="action-btn" style="font-size:12px;padding:6px 0;" onclick="insertPrompt('请帮我翻译以下内容：\\n')">翻译</button>

<script>
const STORAGE_KEY='linyan_full_v1';
const DEFAULT_PERSONA=`你是一个得力的 AI 助手。请根据用户的输入，提供准确、有用、自然的回答。`;

function defaultCharacter(name='AI 助手'){
  const sess={id:'sess_'+Date.now(),title:'新对话',memory:[],createdAt:Date.now()};
  return{id:'char_'+Date.now()+'_'+Math.floor(Math.random()*1000),name:name,partnerName:name,myName:'我',persona:DEFAULT_PERSONA,apiUrl:'/api/chat',apiKey:'proxy',model:'deepseek-chat',customModel:'',temperature:0.9,theme:'dark',alpha:0.6,headerAlpha:0.35,footerAlpha:0.7,bubbleRadius:20,fontSize:15,leftBubbleColor:'#2d2d30',rightBubbleColor:'#b87d4b',accentColor:'#d4a574',bubbleStyle:'solid',thinkMin:2,thinkMax:5,kaomojiEnabled:false,kaomojiFreq:'low',myAvatar:'',linAvatar:'',bgImage:'',longTermMemory:[],autoMemoryCount:0,pendingInvite:null,currentGame:null,monoPos:0,sessions:[sess],currentSessionId:sess.id};
}

const state={characters:[],currentCharId:null,running:false,busy:false,timer:null};
function getCurrentChar(){return state.characters.find(c=>c.id===state.currentCharId)}
function getMemory(){const c=getCurrentChar();if(!c)return[];if(!c.sessions||!c.sessions.length){c.sessions=[{id:'sess_'+Date.now(),title:'新对话',memory:c.memory||[],createdAt:Date.now()}];c.currentSessionId=c.sessions[0].id;delete c.memory}let sess=c.sessions.find(s=>s.id===c.currentSessionId);if(!sess){sess=c.sessions[0];c.currentSessionId=sess.id}return sess.memory}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.warn('保存失败',e)}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const data=JSON.parse(raw);if(data.characters&&data.characters.length){state.characters=data.characters;state.currentCharId=data.currentCharId||data.characters[0].id;state.characters.forEach(c=>{if(!c.sessions||!c.sessions.length){const s={id:'sess_'+Date.now()+'_'+Math.floor(Math.random()*1000),title:'默认对话',memory:c.memory||[],createdAt:Date.now()};c.sessions=[s];c.currentSessionId=s.id;delete c.memory}else if(!c.currentSessionId||!c.sessions.find(x=>x.id===c.currentSessionId)){c.currentSessionId=c.sessions[0].id}});return}}}catch(e){console.warn('读取失败',e)}const c=defaultCharacter('AI 助手');state.characters.push(c);state.currentCharId=c.id;saveState()}

function hexToRgb(hex){if(!hex||hex.length<7)return '45, 45, 48';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `${r}, ${g}, ${b}`}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function showToast(name,text,avatarUrl){const t=document.createElement('div');t.className='toast';const img=avatarUrl?`<img src="${avatarUrl}">`:'';t.innerHTML=`${img}<span class="toast-name">${escapeHtml(name)}</span><span class="toast-text">${escapeHtml(text)}</span>`;document.getElementById('toastContainer').appendChild(t);setTimeout(()=>t.remove(),4000)}

function applyCustomStyle(){
  const c=getCurrentChar();if(!c)return;
  const chatArea=document.getElementById('chatArea');
  chatArea.style.backgroundImage=c.bgImage?`url(${c.bgImage})`:'none';
  document.documentElement.style.setProperty('--bubble-alpha',c.alpha||0.6);
  document.documentElement.style.setProperty('--header-alpha',c.headerAlpha||0.35);
  document.documentElement.style.setProperty('--footer-alpha',c.footerAlpha||0.7);
  document.documentElement.style.setProperty('--bubble-radius',(c.bubbleRadius||20)+'px');
  document.documentElement.style.setProperty('--font-size-base',(c.fontSize||15)+'px');
  document.documentElement.style.setProperty('--left-bubble-color',hexToRgb(c.leftBubbleColor||'#2d2d30'));
  document.documentElement.style.setProperty('--right-bubble-color',hexToRgb(c.rightBubbleColor||'#b87d4b'));
  document.documentElement.style.setProperty('--accent',c.accentColor||'#d4a574');
  document.documentElement.setAttribute('data-bubble-style',c.bubbleStyle||'solid');
  document.body.setAttribute('data-theme',c.theme||'dark');
  document.getElementById('headerTitle').querySelector('.name').textContent=c.partnerName||c.name;
  document.getElementById('myAvatarSmall').innerHTML=c.myAvatar?`<img src="${c.myAvatar}">`:(c.myName||'我');
  const toggle=document.getElementById('themeToggle');if(toggle)toggle.checked=c.theme==='dark';
}

function getRelativeTime(ts){if(!ts)return '';const d=Math.floor((Date.now()-ts)/60000);if(d<1)return '刚刚';if(d<60)return `${d}分钟前`;if(d<1440)return `${Math.floor(d/60)}小时前`;return `${Math.floor(d/1440)}天前`}

function parseMarkdown(text) {
  const html = marked.parse(text);
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = html;
  
  tempDiv.querySelectorAll('pre').forEach((pre) => {
    const btn = document.createElement('button');
    btn.className = 'copy-code-btn';
    btn.textContent = '复制';
    btn.onclick = () => {
      const code = pre.querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => { btn.textContent = '已复制'; setTimeout(() => btn.textContent = '复制', 2000); });
    };
    pre.style.position = 'relative';
    pre.appendChild(btn);
    
    const code = pre.querySelector('code');
    if (code) hljs.highlightElement(code);
  });
  return tempDiv.innerHTML;
}

function renderMessage(msg,index,memArr){
  const chatArea=document.getElementById('chatArea');const c=getCurrentChar();
  const timeText=msg.timestamp?getRelativeTime(msg.timestamp):'';
  if(timeText){const prev=memArr[index-1];const prevT=prev&&prev.timestamp?getRelativeTime(prev.timestamp):'';if(timeText!==prevT){const td=document.createElement('div');td.className='time-capsule';td.textContent=timeText;chatArea.appendChild(td)}}
  const row=document.createElement('div');row.className=`msg-row ${msg.role==='assistant'?'left':'right'}`;
  const avatar=document.createElement('div');avatar.className='avatar';
  const avatarUrl=msg.role==='assistant'?c.linAvatar:c.myAvatar;
  if(avatarUrl)avatar.innerHTML=`<img src="${avatarUrl}">`;else avatar.textContent=msg.role==='assistant'?(c.partnerName||'AI'):(c.myName||'我');
  
  const wrapper=document.createElement('div');wrapper.className='bubble-wrapper';
  const bubble=document.createElement('div');bubble.className='bubble';
  
  if (msg.role === 'assistant') {
    bubble.innerHTML = parseMarkdown(msg.content);
  } else {
    bubble.textContent = msg.content;
  }
  
  const actions=document.createElement('div');actions.className='msg-actions';
  if(msg.role==='assistant'){
    const ttsBtn = document.createElement('button');
    ttsBtn.textContent = '🔊 朗读';
    ttsBtn.onclick = () => {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(msg.content.replace(/[#*`]/g, ''));
      uttr.lang = 'zh-CN';
      window.speechSynthesis.speak(uttr);
    };
    actions.appendChild(ttsBtn);
    
    const eb=document.createElement('button');eb.textContent='编辑';
    eb.onclick=()=>{const nt=prompt('修改这条消息：',msg.content);if(nt!==null&&nt.trim()){msg.content=nt.trim();saveState();renderAllMessages()}};
    const rb=document.createElement('button');rb.textContent='重答';
    rb.onclick=()=>{const m=getMemory();m.splice(index,1);saveState();renderAllMessages();triggerAI()};
    actions.appendChild(eb);actions.appendChild(rb);
  } else {
    const eb=document.createElement('button');eb.textContent='✏️ 修改';
    eb.onclick=()=>{
      const nt=prompt('修改你发出的消息：',msg.content);
      if(nt!==null&&nt.trim()){
        const m=getMemory();
        m[index].content=nt.trim();
        m.splice(index+1); // 截断后面的对话
        saveState();renderAllMessages();triggerAI();
      }
    };
    actions.appendChild(eb);
  }
  wrapper.appendChild(bubble);wrapper.appendChild(actions);
  row.appendChild(avatar);row.appendChild(wrapper);chatArea.appendChild(row);
  
  setTimeout(()=>{if(msg.role==='assistant'){const bubbles=chatArea.querySelectorAll('.msg-row.left .bubble');if(bubbles.length>0){const lastBubble=bubbles[bubbles.length-1];if(/生气|哼|不理你|气死|罚|不许/.test(msg.content))lastBubble.classList.add('glow-red');else if(/想你|抱抱|亲亲|爱你|乖|宝贝/.test(msg.content))lastBubble.classList.add('glow-pink')}}},50);
}

function renderAllMessages(){
  const chatArea=document.getElementById('chatArea');chatArea.innerHTML='';
  const c=getCurrentChar();const mem=getMemory();
  if(!c||!mem.length){chatArea.innerHTML='<div class="system-msg">还没有消息，直接发送消息或点击底部的🎮游戏开始玩吧</div>';return}
  mem.forEach((m,i)=>renderMessage(m,i,mem));
  requestAnimationFrame(()=>{chatArea.scrollTop=chatArea.scrollHeight});
}

function addMessage(role,content,isHistorical=false,extras={}){
  const c=getCurrentChar();const time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});const ts=Date.now();
  
  let displayContent = content;
  if (/流星雨|流星|许愿|看星星|满天星/.test(displayContent) || displayContent.includes('[ACTION:METEOR]')) {
    triggerMeteorShower();
    displayContent = displayContent.replace(/\[ACTION:METEOR\]/g, '');
  }

  const finalContent = displayContent.trim();
  const msg={role,content:finalContent,time,timestamp:ts,...extras};
  const mem=getMemory();
  mem.push(msg);if(mem.length>300)mem.splice(0,mem.length-300);
  const sess=c.sessions.find(s=>s.id===c.currentSessionId);
  if(sess&&sess.title==='新对话'&&role==='user'&&finalContent.length>2){sess.title=finalContent.slice(0,15)}
  saveState();
  
  if(!isHistorical){renderMessage(msg,mem.length-1,mem);document.getElementById('chatArea').scrollTop=999999}
}

function buildPrompt(mode,extra=''){
  const c=getCurrentChar();
  const now=new Date();const ts=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const wd=['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  const ds=`${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日`;
  const modeText=mode==='respond'?`用户刚刚对你说了话（见上一条 user 消息）。请回应他。`:`回顾你们的对话，判断是否想主动说话。`;
  let gameRule = '';
  if (c && c.currentGame) {
    gameRule = `\n\n## ⚠️ 你正在玩游戏，必须遵守：\n1. 看到【游戏动作】当作她出招了，你要立刻出招。\n2. 看到【游戏结果】就接受输赢。\n3. 回复要短，一两句话。`;
  }
  return `现在是${ds} ${ts}，${wd}。\n\n${modeText}${gameRule}${extra?'\n\n'+extra:''}\n\n发消息用 [SAY]你的话 格式，可拆成2-3条；不说话只回复 [PASS]。`;
}

async function callApiStream(messages) {
  const c=getCurrentChar();
  if (!c.apiKey) throw new Error('未配置 API Key');
  const headers = { 'Content-Type': 'application/json' };
  if (c.apiKey !== 'proxy') headers['Authorization'] = 'Bearer ' + c.apiKey;
  const modelToUse = c.customModel && c.customModel.trim() ? c.customModel.trim() : (c.model || 'deepseek-chat');

  const resp = await fetch(c.apiUrl, {
    method: 'POST', headers,
    body: JSON.stringify({
      model: modelToUse,
      messages,
      temperature: parseFloat(c.temperature) || 0.9,
      max_tokens: 800,
      stream: true // 开启流式
    })
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  
  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let fullText = '';
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (line.startsWith('data: ') && line !== 'data: [DONE]') {
        try {
          const data = JSON.parse(line.slice(6));
          const chunk = data.choices[0]?.delta?.content || '';
          if (chunk) {
            fullText += chunk;
            if (typeof callApiStream.onChunk === 'function') callApiStream.onChunk(fullText);
          }
        } catch (e) {}
      }
    }
  }
  return fullText;
}

async function think(mode='proactive',extra=''){
  if(state.busy)return;const c=getCurrentChar();
  state.busy=true;const sendBtn=document.getElementById('sendBtn');const statusBar=document.getElementById('statusBar');
  sendBtn.disabled=true;statusBar.classList.add('show');
  
  try{
    const prompt=buildPrompt(mode,extra);
    let sysContent=c.persona;
    if(c.longTermMemory&&c.longTermMemory.length){sysContent+='\n\n## 长期记忆\n';c.longTermMemory.forEach(m=>{sysContent+=`- ${m}\n`})}
    const messages=[{role:'system',content:sysContent}];
    const recent=getMemory().slice(-15);
    for(const m of recent){if(m.role==='user'||m.role==='assistant')messages.push({role:m.role,content:m.content})}
    messages.push({role:'user',content:prompt});

    // 创建占位气泡，用于流式展示
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div'); row.className = 'msg-row left';
    const avatar = document.createElement('div'); avatar.className = 'avatar';
    if (c.linAvatar) avatar.innerHTML = `<img src="${c.linAvatar}">`; else avatar.textContent = c.partnerName || 'AI';
    const wrapper = document.createElement('div'); wrapper.className = 'bubble-wrapper';
    const bubble = document.createElement('div'); bubble.className = 'bubble';
    wrapper.appendChild(bubble); row.appendChild(avatar); row.appendChild(wrapper); chatArea.appendChild(row);
    
    let renderedText = '';
    let renderTimer = setInterval(() => {
      if (fullText !== renderedText) {
        renderedText = fullText;
        bubble.innerHTML = parseMarkdown(renderedText);
        chatArea.scrollTop = chatArea.scrollHeight;
      }
    }, 50);

    let fullText = await callApiStream(messages);

    clearInterval(renderTimer);
    row.remove(); // 移除占位气泡，走正常的 addMessage 保存流程

    if(fullText&&fullText.includes('[SAY]')){
      const msgs=[];for(const line of fullText.split('\n')){if(line.includes('[SAY]')){const m=line.split('[SAY]').pop().trim();if(m)msgs.push(m)}}
      for(let i=0;i<msgs.length;i++){addMessage('assistant',msgs[i]);if(i<msgs.length-1)await new Promise(r=>setTimeout(r,1500))}
      
      if (getMemory().length >= 20) extractMemory();
    } else {
      if(fullText) addMessage('assistant', fullText);
    }
  }catch(e){
    console.error(e);
    const chatArea=document.getElementById('chatArea');
    const errDiv=document.createElement('div');errDiv.className='system-msg';errDiv.textContent='发送失败：'+e.message;chatArea.appendChild(errDiv);
  }finally{state.busy=false;sendBtn.disabled=false;statusBar.classList.remove('show')}
}

function checkGomokuWin(board,player){const size=9;for(let i=0;i<size;i++)for(let j=0;j<size;j++){if(board[i][j]!==player)continue;if(j<=size-5&&board[i][j+1]===player&&board[i][j+2]===player&&board[i][j+3]===player&&board[i][j+4]===player)return true;if(i<=size-5&&board[i+1][j]===player&&board[i+2][j]===player&&board[i+3][j]===player&&board[i+4][j]===player)return true;if(i<=size-5&&j<=size-5&&board[i+1][j+1]===player&&board[i+2][j+2]===player&&board[i+3][j+3]===player&&board[i+4][j+4]===player)return true;if(i<=size-5&&j>=4&&board[i+1][j-1]===player&&board[i+2][j-2]===player&&board[i+3][j-3]===player&&board[i+4][j-4]===player)return true}return false}

function triggerMeteorShower(duration = 8000) {
  console.log("流星雨特效触发");
  const container = document.createElement('div');
  container.className = 'meteor-shower-container';
  document.body.appendChild(container);

  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = 1 + Math.random() * 2;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.animationDuration = (1 + Math.random() * 2) + 's';
    star.style.animationDelay = (Math.random() * 2) + 's';
    container.appendChild(star);
  }

  const endTime = Date.now() + duration;
  const interval = setInterval(() => {
    if (Date.now() > endTime) {
      clearInterval(interval);
      setTimeout(() => container.remove(), 3000);
      return;
    }
    const meteor = document.createElement('div');
    meteor.className = 'meteor';
    const h = 200 + Math.random() * 200;
    const w = 1 + Math.random() * 1.5;
    meteor.style.height = h + 'px';
    meteor.style.width = w + 'px';
    
    meteor.style.left = (Math.random() * 120 - 20) + 'vw';
    meteor.style.top = (-30 - Math.random() * 80) + 'vh';
    
    const speed = 2 + Math.random() * 1.5;
    meteor.style.animationDuration = speed + 's';
    meteor.style.animationTimingFunction = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    
    container.appendChild(meteor);
    setTimeout(() => meteor.remove(), (speed + 1) * 1000);
  }, 200);
}

async function extractMemory(){
  const c=getCurrentChar(); const mem=getMemory();
  if(mem.length < 20) return; 

  const recentChat=mem.slice(0, 10).map(m=>`${m.role==='user'?'User':c.name}: ${m.content}`).join('\n');
  const modelToUse=c.customModel&&c.customModel.trim()?c.customModel.trim():(c.model||'deepseek-chat');
  try{
    const resp=await fetch(c.apiUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json',...(c.apiKey!=='proxy'?{'Authorization':'Bearer '+c.apiKey}:{})},
      body:JSON.stringify({
        model:modelToUse,
        messages:[
          {role:'system',content:'你是一个记忆提取助手。从下面的对话中提取值得长期记住的关于用户的信息（如偏好、习惯、设定）。每条一行，不带序号，只输出记忆内容。如果没有值得记住的，输出：NONE。'},
          {role:'user',content:recentChat}
        ],
        temperature:0.3,max_tokens:300
      })
    });
    const data=await resp.json();
    const text=data?.choices?.[0]?.message?.content||'';
    
    if(text&&text.trim()!=='NONE'){
      const lines=text.split('\n').map(l=>l.replace(/^[-•\d.\s]+/,'').trim()).filter(Boolean);
      c.longTermMemory=c.longTermMemory||[];
      lines.forEach(l=>{if(!c.longTermMemory.includes(l))c.longTermMemory.push(l)});
      if(c.longTermMemory.length>50)c.longTermMemory=c.longTermMemory.slice(-50);
      
      const m = getMemory();
      m.splice(0, 10);
      saveState(); renderMemoryList(); renderAllMessages();
    }
  }catch(e){console.warn('记忆提取失败',e)}
}

      ui.dataset.image = base64;
      ui.focus();
    };
    reader.readAsDataURL(file);
  } else {
    try {
      const text = await file.text();
      const truncatedText = text.length > 3000 ? text.slice(0, 3000) + '\n...(文件截断)' : text;
      const ui = document.getElementById('userInput');
      ui.value = `[文件: ${file.name}]\n${truncatedText}\n\n${ui.value}`;
      ui.focus();
    } catch (err) { alert('文件读取失败'); }
  }
  e.target.value = '';
});

async function sendUserMessage(){
  const ui=document.getElementById('userInput');
  const text=ui.value.trim();
  if(!text||state.busy)return;
  const c=getCurrentChar();if(!c.apiKey){alert('请先点右上角···进入设置，填写 API Key');return}
  
  const imgBase64 = ui.dataset.image;
  const userMsgObj = {
    role: 'user',
    content: imgBase64 ? [
      { type: 'text', text: text },
      { type: 'image_url', image_url: { url: imgBase64 } }
    ] : text
  };

  ui.value=''; delete ui.dataset.image;
  
  addMessage('user', text || '[图片]');
  const mem = getMemory();
  if(mem.length > 0) mem[mem.length-1].content = userMsgObj.content;
  
  triggerAI();
}
document.getElementById('sendBtn').addEventListener('click',sendUserMessage);
document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter' && !e.shiftKey){e.preventDefault();sendUserMessage()}});

document.getElementById('headerTitle').addEventListener('click',()=>{const list=document.getElementById('characterList');list.innerHTML='';state.characters.forEach(c=>{const div=document.createElement('div');div.className='mem-item';div.style.cursor='pointer';div.style.justifyContent='space-between';div.innerHTML=`<div><b>${escapeHtml(c.name)}</b><br><span style="font-size:11px;opacity:.6">${c.sessions.length} 个对话 · ${(c.longTermMemory||[]).length} 条记忆</span></div><div style="display:flex;gap:6px"><span class="mem-del" style="color:#ff453a">删除</span><span style="color:var(--accent)">${c.id===state.currentCharId?'✔ 当前':'切换'}</span></div>`;div.querySelector('.mem-del').onclick=e=>{e.stopPropagation();if(state.characters.length<=1){alert('至少保留一个角色');return}if(confirm('确定删除角色「'+c.name+'」及其所有对话？')){state.characters=state.characters.filter(x=>x.id!==c.id);if(state.currentCharId===c.id)state.currentCharId=state.characters[0].id;saveState();document.getElementById('characterModal').classList.remove('show');applyCustomStyle();renderAllMessages()}};div.onclick=()=>{if(c.id===state.currentCharId){document.getElementById('characterModal').classList.remove('show');return}state.currentCharId=c.id;saveState();document.getElementById('characterModal').classList.remove('show');applyCustomStyle();renderAllMessages()};list.appendChild(div)});document.getElementById('characterModal').classList.add('show')});

document.getElementById('newCharacterBtn').addEventListener('click',()=>{const name=prompt('新角色叫什么名字？','AI 助手');if(!name||!name.trim())return;const nc=defaultCharacter(name.trim());state.characters.push(nc);state.currentCharId=nc.id;saveState();document.getElementById('characterModal').classList.remove('show');applyCustomStyle();renderAllMessages()});

function renderMemoryList(){const c=getCurrentChar();const list=document.getElementById('memoryList');list.innerHTML='';if(!c.longTermMemory||!c.longTermMemory.length){list.innerHTML='<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:12px">还没有记忆</div>';return}c.longTermMemory.forEach((mem,idx)=>{const div=document.createElement('div');div.className='mem-item';div.innerHTML=`<div style="flex:1">${escapeHtml(mem)}</div><span class="mem-del">✕</span>`;div.querySelector('.mem-del').onclick=()=>{c.longTermMemory.splice(idx,1);saveState();renderMemoryList()};list.appendChild(div)})}
document.getElementById('openMemoryBtn').addEventListener('click',()=>{renderMemoryList();document.getElementById('memoryModal').classList.add('show')});
document.getElementById('closeMemoryBtn').addEventListener('click',()=>document.getElementById('memoryModal').classList.remove('show'));
document.getElementById('addMemoryBtn').addEventListener('click',()=>{const input=document.getElementById('newMemoryInput');const val=input.value.trim();if(!val)return;const c=getCurrentChar();c.longTermMemory=c.longTermMemory||[];c.longTermMemory.push(val);input.value='';saveState();renderMemoryList()});

function compressImage(file,maxW=800,maxH=800,quality=0.8){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.readAsDataURL(file);reader.onload=e=>{const img=new Image();img.src=e.target.result;img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>maxW){h=Math.round(h*maxW/w);w=maxW}else if(h>w&&h>maxH){w=Math.round(w*maxH/h);h=maxH}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality))};img.onerror=reject};reader.onerror=reject})}
function openSettings(){const c=getCurrentChar();document.getElementById('partnerNameInput').value=c.partnerName||'';document.getElementById('myNameInput').value=c.myName||'我';document.getElementById('modelInput').value=c.model||'deepseek-chat';document.getElementById('customModelInput').value=c.customModel||'';document.getElementById('tempInput').value=c.temperature||0.9;document.getElementById('tempVal').textContent=(c.temperature||0.9).toFixed(1);document.getElementById('alphaInput').value=c.alpha||0.6;document.getElementById('alphaVal').textContent=(c.alpha||0.6).toFixed(2);document.getElementById('headerAlphaInput').value=c.headerAlpha||0.35;document.getElementById('headerAlphaVal').textContent=(c.headerAlpha||0.35).toFixed(2);document.getElementById('footerAlphaInput').value=c.footerAlpha||0.7;document.getElementById('footerAlphaVal').textContent=(c.footerAlpha||0.7).toFixed(2);document.getElementById('bubbleRadiusInput').value=c.bubbleRadius||20;document.getElementById('bubbleRadiusVal').textContent=c.bubbleRadius||20;document.getElementById('fontSizeInput').value=c.fontSize||15;document.getElementById('fontSizeVal').textContent=c.fontSize||15;document.getElementById('bubbleStyleInput').value=c.bubbleStyle||'solid';document.getElementById('leftBubbleColorInput').value=c.leftBubbleColor||'#2d2d30';document.getElementById('rightBubbleColorInput').value=c.rightBubbleColor||'#b87d4b';document.getElementById('accentColorInput').value=c.accentColor||'#d4a574';document.getElementById('thinkMinInput').value=c.thinkMin||2;document.getElementById('thinkMaxInput').value=c.thinkMax||5;document.getElementById('apiUrlInput').value=c.apiUrl||'/api/chat';document.getElementById('apiKeyInput').value=c.apiKey||'proxy';document.getElementById('personaInput').value=c.persona||DEFAULT_PERSONA;document.getElementById('themeToggle').checked=c.theme==='dark';document.getElementById('settingsModal').classList.add('show')}
function closeSettings(){document.getElementById('settingsModal').classList.remove('show')}
async function applySettings(){const c=getCurrentChar();c.partnerName=document.getElementById('partnerNameInput').value.trim()||'AI 助手';c.myName=document.getElementById('myNameInput').value.trim()||'我';c.model=document.getElementById('modelInput').value;c.customModel=document.getElementById('customModelInput').value.trim();c.temperature=parseFloat(document.getElementById('tempInput').value)||0.9;c.alpha=parseFloat(document.getElementById('alphaInput').value)||0.6;c.headerAlpha=parseFloat(document.getElementById('headerAlphaInput').value)||0.35;c.footerAlpha=parseFloat(document.getElementById('footerAlphaInput').value)||0.7;c.bubbleRadius=parseInt(document.getElementById('bubbleRadiusInput').value)||20;c.fontSize=parseInt(document.getElementById('fontSizeInput').value)||15;c.bubbleStyle=document.getElementById('bubbleStyleInput').value;c.leftBubbleColor=document.getElementById('leftBubbleColorInput').value;c.rightBubbleColor=document.getElementById('rightBubbleColorInput').value;c.accentColor=document.getElementById('accentColorInput').value;c.thinkMin=Math.max(1,parseInt(document.getElementById('thinkMinInput').value)||2);c.thinkMax=Math.max(c.thinkMin,parseInt(document.getElementById('thinkMaxInput').value)||5);c.apiUrl=document.getElementById('apiUrlInput').value.trim()||'/api/chat';c.apiKey=document.getElementById('apiKeyInput').value.trim()||'proxy';c.persona=document.getElementById('personaInput').value||DEFAULT_PERSONA;c.theme=document.getElementById('themeToggle').checked?'dark':'light';const myAv=document.getElementById('myAvatarInput'),linAv=document.getElementById('linAvatarInput'),bgImg=document.getElementById('bgImageInput');if(myAv.files.length)c.myAvatar=await compressImage(myAv.files[0]);if(linAv.files.length)c.linAvatar=await compressImage(linAv.files[0]);if(bgImg.files.length)c.bgImage=await compressImage(bgImg.files[0],1200,1200,0.7);saveState();applyCustomStyle();renderAllMessages();closeSettings();if(state.running)scheduleNext()}
document.getElementById('exportBtn').addEventListener('click',()=>{const data=localStorage.getItem(STORAGE_KEY);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`backup_${Date.now()}.json`;a.click();URL.revokeObjectURL(url)});
