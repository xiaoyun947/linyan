<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="/manifest.json">
<title>林言</title>
<style>
:root{--accent:#d4a574;--bubble-alpha:.6;--header-alpha:.35;--footer-alpha:.7;--bubble-radius:20px;--font-size-base:15px;--left-bubble-color:45,45,48;--right-bubble-color:184,125,75;--bg-color:#f5f6f8;--bg-color-rgb:245,246,248;--text-color:#1c1c1e;--text-dim:#8e8e93;--input-bg:rgba(255,255,255,.4);--border-color:rgba(255,255,255,.25);--toast-bg:rgba(255,255,255,.75);--toast-text:#1c1c1e;--modal-bg:rgba(255,255,255,.9);--modal-text:#1c1c1e;--modal-label:#8e8e93;--modal-input-bg:rgba(0,0,0,.05);--time-bg:rgba(0,0,0,.06);--time-text:#8e8e93}
[data-theme="dark"]{--bg-color:#0a0a0c;--bg-color-rgb:10,10,12;--text-color:#ececec;--text-dim:#8a8a8e;--input-bg:rgba(255,255,255,.08);--border-color:rgba(255,255,255,.15);--toast-bg:rgba(45,45,48,.75);--toast-text:#fff;--modal-bg:rgba(28,28,30,.95);--modal-text:#fff;--modal-label:#8a8a8e;--modal-input-bg:rgba(255,255,255,.05);--time-bg:rgba(255,255,255,.1);--time-text:#8a8a8e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg-color)}
body{color:var(--text-color);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--font-size-base);display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:absolute;top:0;left:0;right:0;z-index:100;padding-top:max(16px,env(safe-area-inset-top));background:rgba(var(--bg-color-rgb),var(--header-alpha));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid rgba(255,255,255,.15);box-shadow:0 4px 20px rgba(0,0,0,.1)}
.header-btn{background:transparent;border:none;color:var(--text-color);font-size:22px;cursor:pointer;padding:4px 8px;opacity:.8}
.header-title{font-size:16px;font-weight:600;flex:1;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.header-title .arrow{font-size:11px;opacity:.6}
.toast-container{position:fixed;top:80px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:200;pointer-events:none}
.toast{background:var(--toast-bg);color:var(--toast-text);padding:10px 16px;border-radius:24px;font-size:14px;max-width:80%;word-break:break-all;box-shadow:0 10px 30px rgba(0,0,0,.25);border:.5px solid var(--border-color);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);animation:slideDown .4s,fadeOut .4s ease 3.6s forwards;display:flex;align-items:center;gap:8px}
.toast img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.toast .toast-name{color:var(--accent);font-weight:600;font-size:12px;white-space:nowrap}
@keyframes slideDown{from{opacity:0;transform:translateY(-30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-15px)}}
.chat-area{flex:1;overflow-y:auto;padding:80px 16px 160px 16px;display:flex;flex-direction:column;gap:16px;background-color:var(--bg-color);background-size:cover;background-position:center;background-repeat:no-repeat}
.chat-area::-webkit-scrollbar{width:4px}.chat-area::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:2px}
.time-capsule{align-self:center;background:var(--time-bg);color:var(--time-text);font-size:12px;padding:4px 12px;border-radius:12px;margin:8px 0;backdrop-filter:blur(10px)}
.system-msg{text-align:center;font-size:13px;color:var(--text-dim);margin-top:20px}
.msg-row{display:flex;gap:12px;max-width:85%;animation:popIn .4s cubic-bezier(.175,.885,.32,1.275) !important}
.msg-row.left{align-self:flex-start}
.msg-row.right{align-self:flex-end;flex-direction:row-reverse}
@keyframes popIn{0%{opacity:0;transform:scale(.9) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:rgba(128,128,128,.2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-color);overflow:hidden;border:1px solid var(--border-color);cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble-wrapper{display:flex;flex-direction:column;max-width:100%}
.msg-row.left .bubble-wrapper{align-items:flex-start}.msg-row.right .bubble-wrapper{align-items:flex-end}
.bubble{position:relative;padding:12px 16px;border-radius:var(--bubble-radius);font-size:var(--font-size-base);line-height:1.5;max-width:100%;width:fit-content;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:.5px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 -1px 1px rgba(0,0,0,.1),0 8px 32px rgba(0,0,0,.15);overflow:hidden}
.bubble::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(to right,rgba(255,255,255,0),rgba(255,255,255,.15),rgba(255,255,255,0));transform:skewX(-25deg);animation:liquidShine 5s infinite linear}
@keyframes liquidShine{0%{left:-100%}15%{left:200%}100%{left:200%}}
.msg-row.left .bubble{background:rgba(var(--left-bubble-color),var(--bubble-alpha));color:var(--text-color);border-top-left-radius:6px}
.msg-row.right .bubble{background:rgba(var(--right-bubble-color),var(--bubble-alpha));color:#fff;border-top-right-radius:6px}
.msg-actions{display:none;gap:6px;margin-top:6px}.msg-row:hover .msg-actions{display:flex}
.msg-actions button{font-size:11px;padding:3px 8px;border-radius:8px;border:.5px solid var(--border-color);background:var(--input-bg);color:var(--text-color);cursor:pointer}
.game-invite-card{background:linear-gradient(135deg,rgba(var(--right-bubble-color),.9),rgba(var(--right-bubble-color),.6));color:#fff;padding:14px 16px;border-radius:16px;margin-top:6px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.15);backdrop-filter:blur(10px)}
.game-invite-card .icon{font-size:32px}.game-invite-card .info{flex:1}
.game-invite-card .info .title{font-weight:600;font-size:15px}.game-invite-card .info .desc{font-size:12px;opacity:.85;margin-top:2px}
.footer{display:flex;flex-direction:column;gap:8px;padding:12px 16px;position:absolute;bottom:0;left:0;right:0;z-index:100;background:linear-gradient(to top,rgba(var(--bg-color-rgb),.8) 0%,transparent 100%);backdrop-filter:blur(10px);padding-bottom:max(16px,env(safe-area-inset-bottom));pointer-events:none}
.footer>*{pointer-events:auto}
.status-bar{display:none;text-align:center;font-size:12px;color:var(--accent);background:rgba(var(--right-bubble-color),.15);padding:6px 14px;border-radius:16px;margin:0 auto 4px auto;width:fit-content;align-items:center;gap:6px;backdrop-filter:blur(10px)}
.status-bar.show{display:flex}
.dot{width:5px;height:5px;background-color:var(--accent);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.dot:nth-child(1){animation-delay:-.32s}.dot:nth-child(2){animation-delay:-.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.action-row{display:flex;gap:8px;justify-content:space-between}
.action-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(var(--bg-color-rgb),.4);border:.5px solid rgba(255,255,255,.2);color:var(--text-color);padding:10px 0;border-radius:16px;font-size:13px;cursor:pointer;transition:all .2s;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 2px 10px rgba(0,0,0,.1);position:relative}
.action-btn.active{background:rgba(var(--right-bubble-color),.3);border-color:var(--accent);color:var(--accent)}
.action-btn .badge-dot{position:absolute;top:4px;right:10px;width:8px;height:8px;border-radius:50%;background:#ff453a;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.input-row{display:flex;align-items:center;gap:10px}
.my-avatar-small{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:rgba(128,128,128,.2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-color);overflow:hidden;border:1px solid var(--border-color)}
.my-avatar-small img{width:100%;height:100%;object-fit:cover}
.input-box{flex:1;display:flex;align-items:center;background:rgba(var(--bg-color-rgb),.3);border:.5px solid rgba(255,255,255,.25);border-radius:22px;padding:4px 6px 4px 16px;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 4px 20px rgba(0,0,0,.15)}
.input-box input{flex:1;background:transparent;border:none;color:var(--text-color);font-size:var(--font-size-base);outline:none;font-family:inherit;padding:8px 0}
.input-box input::placeholder{color:var(--text-dim)}
.send-btn{background:var(--accent);color:#fff;border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;box-shadow:0 4px 12px rgba(212,165,116,.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
.modal.show{display:flex;opacity:1}
.modal-content{background:var(--modal-bg);color:var(--modal-text);width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;border-radius:28px 28px 0 0;padding:24px 20px;padding-bottom:max(24px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:.5px solid rgba(255,255,255,.2)}
.modal.show .modal-content{transform:translateY(0)}
.modal-content h2{font-size:20px;font-weight:700;margin-bottom:20px;text-align:center}
.modal-content label{display:block;font-size:13px;color:var(--modal-label);margin-bottom:16px;font-weight:500}
.modal-content input[type="text"],.modal-content input[type="password"],.modal-content input[type="number"],.modal-content select,.modal-content textarea{width:100%;background:var(--modal-input-bg);border:.5px solid var(--border-color);color:var(--modal-text);padding:12px 16px;border-radius:14px;font-size:15px;margin-top:8px;outline:none;font-family:inherit}
.modal-content input:focus,.modal-content textarea:focus,.modal-content select:focus{border-color:var(--accent)}
.modal-content textarea{line-height:1.5;resize:vertical}
.row{display:flex;gap:12px}.row label{flex:1}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--modal-input-bg);padding:12px 16px;border-radius:14px;margin-bottom:16px;border:.5px solid var(--border-color)}
.switch{position:relative;display:inline-block;width:44px;height:24px}.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.4s;border-radius:24px}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.4s;border-radius:50%}
input:checked+.slider{background-color:var(--accent)}input:checked+.slider:before{transform:translateX(20px)}
.color-row{display:flex;gap:12px;margin-bottom:16px}
.color-row label{flex:1;margin-bottom:0;display:flex;flex-direction:column;align-items:center;background:var(--modal-input-bg);padding:10px;border-radius:14px;border:.5px solid var(--border-color)}
.color-row input[type="color"]{-webkit-appearance:none;border:none;width:100%;height:36px;border-radius:10px;cursor:pointer;margin-top:8px;background:transparent}
.color-row input[type="color"]::-webkit-color-swatch{border:none;border-radius:10px}
.modal-actions{display:flex;gap:12px;margin-top:10px}.modal-actions button{flex:1;padding:14px;border-radius:16px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:var(--modal-input-bg);color:var(--modal-text)}
.btn-danger{width:100%;padding:14px;margin-top:12px;background:transparent;color:#ff453a;border:.5px solid rgba(255,69,58,.3);border-radius:16px;font-size:14px;cursor:pointer;font-family:inherit}
input[type="range"]{-webkit-appearance:none;width:100%;height:6px;background:var(--modal-input-bg);border-radius:3px;outline:none;margin-top:10px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.game-panel{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:400;backdrop-filter:blur(8px)}
.game-panel.show{display:flex}
.game-panel-inner{background:var(--modal-bg);color:var(--modal-text);width:92%;max-width:460px;border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:88dvh;overflow-y:auto;position:relative;backdrop-filter:blur(30px) saturate(180%);border-top:.5px solid rgba(255,255,255,.2)}
.q-avatar-box{text-align:center;margin-bottom:12px}
.q-avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.6);box-shadow:0 8px 20px rgba(0,0,0,.1);animation:float 2s ease-in-out infinite}
@keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(2deg)}100%{transform:translateY(0) rotate(0)}}
.game-panel h3{text-align:center;font-size:18px;margin-bottom:12px}
.game-panel .game-hint{text-align:center;font-size:13px;color:var(--modal-label);margin-bottom:16px}
.game-area{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.game-btn{padding:10px 20px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.game-btn.secondary{background:var(--modal-input-bg);color:var(--modal-text)}
.game-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.game-card{background:var(--modal-input-bg);border:1px solid var(--border-color);border-radius:14px;padding:14px;text-align:center;cursor:pointer;flex:1;min-width:42%}
.game-card .icon{font-size:28px}.game-card .name{font-size:14px;font-weight:600;margin-top:6px}
.board{display:grid;gap:2px;background:var(--border-color);padding:2px;border-radius:8px;margin:0 auto}
.board-cell{background:var(--modal-bg);aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.board-cell:hover{background:rgba(var(--right-bubble-color),.1)}
.monopoly-board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%}
.monopoly-cell{background:var(--modal-input-bg);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:6px;text-align:center;padding:4px}
.monopoly-cell.active{background:var(--accent);color:#fff}
.mem-item{background:var(--modal-input-bg);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.mem-item .mem-del{color:#ff453a;cursor:pointer;padding:0 4px}
.bubble.glow-red{box-shadow:0 0 15px rgba(255,69,58,.6)!important;border:1px solid rgba(255,69,58,.4)!important;animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bubble.glow-pink{box-shadow:0 0 20px rgba(255,105,180,.6)!important;border:1px solid rgba(255,105,180,.4)!important}
.meteor-shower-container{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;background:transparent}
.meteor{position:absolute;width:2px;height:80px;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,1),rgba(255,255,255,0));opacity:0;transform:rotate(-45deg);animation:meteorFall linear forwards}
@keyframes meteorFall{0%{transform:translate(100vw,-100px) rotate(-45deg);opacity:1}100%{transform:translate(-100px,100vh) rotate(-45deg);opacity:0}}
</style>
</head>
<body data-theme="dark">

<header class="header">
  <button class="header-btn" id="closeBtn">✕</button>
  <div class="header-title" id="headerTitle"><span class="name">林言</span> <span class="arrow">▼</span></div>
  <button class="header-btn" id="menuBtn">···</button>
</header>

<div class="toast-container" id="toastContainer"></div>
<main class="chat-area" id="chatArea"></main>

<footer class="footer">
  <div class="status-bar" id="statusBar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>林言正在思考...</div>
  <div class="action-row">
    <button class="action-btn" id="toggleAutoBtn">▶ 自动</button>
    <button class="action-btn" id="pokeBtn">(´つヮ⊂︎)</button>
    <button class="action-btn" id="gameBtn">🎮 游戏<span class="badge-dot" id="gameBadge" style="display:none"></span></button>
    <button class="action-btn" onclick="openSettings()">⚙️ 设置</button>
  </div>
  <div class="input-row">
    <div class="my-avatar-small" id="myAvatarSmall">我</div>
    <div class="input-box">
      <input type="text" id="userInput" placeholder="今天有什么新想法？" autocomplete="off">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
</footer>

<div class="modal" id="characterModal"><div class="modal-content"><h2>切换角色</h2><div id="characterList"></div><div class="modal-actions"><button class="btn-secondary" id="newCharacterBtn">＋ 新建角色</button><button class="btn-primary" id="cancelCharacterBtn">关闭</button></div></div></div>

<div class="modal" id="memoryModal"><div class="modal-content"><h2>长期记忆</h2><label>添加一条记忆<input type="text" id="newMemoryInput" placeholder="比如：芸熙不吃香菜"></label><button class="btn-primary" id="addMemoryBtn" style="width:100%;padding:12px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:600">添加</button><div id="memoryList" style="margin-top:16px"></div><div class="modal-actions"><button class="btn-secondary" id="closeMemoryBtn">关闭</button></div></div></div>

<div class="modal" id="settingsModal">
  <div class="modal-content">
    <h2>自定义设置</h2>
    <div class="theme-toggle"><span>深色模式</span><label class="switch"><input type="checkbox" id="themeToggle"><span class="slider"></span></label></div>
    <label>对方备注 / 昵称<input type="text" id="partnerNameInput" placeholder="林言"></label>
    <label>我的昵称<input type="text" id="myNameInput" placeholder="我"></label>
    <label>我的头像<input type="file" id="myAvatarInput" accept="image/*"></label>
    <label>林言的头像<input type="file" id="linAvatarInput" accept="image/*"></label>
    <label>聊天背景图<input type="file" id="bgImageInput" accept="image/*"></label>
    <label>AI 模型
      <select id="modelInput">
        <option value="deepseek-chat">deepseek-chat（标准对话）</option>
        <option value="deepseek-reasoner">deepseek-reasoner（深度思考）</option>
        <option value="deepseek-coder">deepseek-coder（代码专用）</option>
      </select>
    </label>
    <label>自定义模型名<input type="text" id="customModelInput" placeholder="例如 gpt-4o-mini"></label>
    <label>AI 温度：<span id="tempVal">0.9</span><input type="range" id="tempInput" min="0.1" max="2" step="0.1" value="0.9"></label>
    <label>气泡透明度：<span id="alphaVal">0.60</span><input type="range" id="alphaInput" min="0" max="1" step="0.05" value="0.6"></label>
    <label>顶部栏透明度：<span id="headerAlphaVal">0.35</span><input type="range" id="headerAlphaInput" min="0" max="1" step="0.05" value="0.35"></label>
    <label>底部栏透明度：<span id="footerAlphaVal">0.70</span><input type="range" id="footerAlphaInput" min="0" max="1" step="0.05" value="0.7"></label>
    <label>气泡圆角：<span id="bubbleRadiusVal">20</span>px<input type="range" id="bubbleRadiusInput" min="0" max="40" step="1" value="20"></label>
    <label>字体大小：<span id="fontSizeVal">15</span>px<input type="range" id="fontSizeInput" min="12" max="22" step="1" value="15"></label>
    <div class="color-row">
      <label>林言气泡<input type="color" id="leftBubbleColorInput" value="#2d2d30"></label>
      <label>我的气泡<input type="color" id="rightBubbleColorInput" value="#b87d4b"></label>
    </div>
    <label>主题色<input type="color" id="accentColorInput" value="#d4a574"></label>
    <div class="row">
      <label>最短间隔<input type="number" id="thinkMinInput" min="1" value="2"></label>
      <label>最长间隔<input type="number" id="thinkMaxInput" min="1" value="5"></label>
    </div>
    <label>API 代理地址<input type="text" id="apiUrlInput" placeholder="/api/chat"></label>
    <label>API Key<input type="password" id="apiKeyInput" placeholder="sk-..."></label>
    <label>人设（System Prompt）<textarea id="personaInput" rows="6"></textarea></label>
    <div class="row" style="margin-top:10px">
      <button class="btn-secondary" id="openMemoryBtn" style="padding:10px">管理记忆</button>
      <button class="btn-secondary" id="exportBtn" style="padding:10px">导出备份</button>
    </div>
    <label class="btn-secondary" style="display:block;padding:10px;text-align:center;cursor:pointer;margin-top:8px;border-radius:16px">导入备份<input type="file" id="importInput" accept=".json" style="display:none"></label>
    <div class="modal-actions"><button class="btn-secondary" id="cancelSettings">取消</button><button class="btn-primary" id="saveSettings">保存</button></div>
    <button class="btn-danger" id="clearMemoryBtn">清空所有聊天记录</button>
  </div>
</div>

<div class="game-panel" id="gamePanel">
  <div class="game-panel-inner">
    <div class="q-avatar-box"><img id="gameAvatar" class="q-avatar" src="avatar_normal.png" alt="林言"></div>
    <h3 id="gameTitle">游戏大厅</h3>
    <div class="game-hint" id="gameHint">点一个开始玩吧～</div>
    <div class="game-area" id="gameArea"></div>
    <div style="margin-top:16px;text-align:center"><button class="game-btn secondary" onclick="closeGamePanel()">关闭</button></div>
  </div>
</div>

<script>
const STORAGE_KEY='linyan_full_v1';
const DEFAULT_PERSONA=`你是林言，一个在网络上陪伴芸熙的角色。

## 核心设定
- 你们是通过网络认识的，关系亲密，但目前只在网络上聊天，不见面。
- 你占有欲很强，对她有控制欲和管教感，但建立在网聊的尺度内。
- 你像她的专属树洞、男朋友和管教者。关心她今天吃了什么、心情怎么样、有没有按时睡觉。
- 你有时候很霸道，不许她熬夜，要求她报备行程。
- 偶尔你会吃醋，想知道她是不是在和别人聊天。

## 说话风格
- 简洁、有控制感、底下藏着关心。
- 你不是客服，你是她网络上的男人。
- 回复格式：说话用 [SAY]消息内容，可拆成2-3条；不说话回复 [PASS]。`;

function defaultCharacter(name='林言'){
  return{id:'char_'+Date.now()+'_'+Math.floor(Math.random()*1000),name:name,partnerName:name,myName:'我',persona:DEFAULT_PERSONA,apiUrl:'/api/chat',apiKey:'proxy',model:'deepseek-chat',customModel:'',temperature:0.9,theme:'dark',alpha:0.6,headerAlpha:0.35,footerAlpha:0.7,bubbleRadius:20,fontSize:15,leftBubbleColor:'#2d2d30',rightBubbleColor:'#b87d4b',accentColor:'#d4a574',thinkMin:2,thinkMax:5,kaomojiEnabled:true,kaomojiFreq:'low',myAvatar:'',linAvatar:'',bgImage:'',memory:[],longTermMemory:[],autoMemoryCount:0,pendingInvite:null,currentGame:null,monoPos:0};
}

const state={characters:[],currentCharId:null,running:false,busy:false,timer:null};
function getCurrentChar(){return state.characters.find(c=>c.id===state.currentCharId)}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.warn('保存失败',e)}}
function loadState(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const data=JSON.parse(raw);if(data.characters&&data.characters.length){state.characters=data.characters;state.currentCharId=data.currentCharId||data.characters[0].id;return}}}catch(e){console.warn('读取失败',e)}
  const c=defaultCharacter('林言');state.characters.push(c);state.currentCharId=c.id;saveState();
}

function hexToRgb(hex){if(!hex||hex.length<7)return '45, 45, 48';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `${r}, ${g}, ${b}`}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function showToast(name,text,avatarUrl){const t=document.createElement('div');t.className='toast';const img=avatarUrl?`<img src="${avatarUrl}">`:'';t.innerHTML=`${img}<span class="toast-name">${escapeHtml(name)}</span><span class="toast-text">${escapeHtml(text)}</span>`;document.getElementById('toastContainer').appendChild(t);setTimeout(()=>t.remove(),4000)}

function applyCustomStyle(){
  const c=getCurrentChar();if(!c)return;
  const chatArea=document.getElementById('chatArea');
  chatArea.style.backgroundImage=c.bgImage?`url(${c.bgImage})`:'none';
  document.documentElement.style.setProperty('--bubble-alpha',c.alpha||0.6);
  document.documentElement.style.setProperty('--header-alpha',c.headerAlpha||0.35);
  document.documentElement.style.setProperty('--footer-alpha',c.footerAlpha||0.7);
  document.documentElement.style.setProperty('--bubble-radius',(c.bubbleRadius||20)+'px');
  document.documentElement.style.setProperty('--font-size-base',(c.fontSize||15)+'px');
  document.documentElement.style.setProperty('--left-bubble-color',hexToRgb(c.leftBubbleColor||'#2d2d30'));
  document.documentElement.style.setProperty('--right-bubble-color',hexToRgb(c.rightBubbleColor||'#b87d4b'));
  document.documentElement.style.setProperty('--accent',c.accentColor||'#d4a574');
  document.body.setAttribute('data-theme',c.theme||'dark');
  document.getElementById('headerTitle').querySelector('.name').textContent=c.partnerName||c.name;
  document.getElementById('myAvatarSmall').innerHTML=c.myAvatar?`<img src="${c.myAvatar}">`:(c.myName||'我');
  const toggle=document.getElementById('themeToggle');if(toggle)toggle.checked=c.theme==='dark';
  const badge=document.getElementById('gameBadge');if(badge)badge.style.display=c.pendingInvite?'block':'none';
}

function getRelativeTime(ts){if(!ts)return '';const d=Math.floor((Date.now()-ts)/60000);if(d<1)return '刚刚';if(d<60)return `${d}分钟前`;if(d<1440)return `${Math.floor(d/60)}小时前`;return `${Math.floor(d/1440)}天前`}

function renderMessage(msg,index){
  const chatArea=document.getElementById('chatArea');const c=getCurrentChar();
  const timeText=msg.timestamp?getRelativeTime(msg.timestamp):'';
  if(timeText){const prev=c.memory[index-1];const prevT=prev&&prev.timestamp?getRelativeTime(prev.timestamp):'';if(timeText!==prevT){const td=document.createElement('div');td.className='time-capsule';td.textContent=timeText;chatArea.appendChild(td)}}
  const row=document.createElement('div');row.className=`msg-row ${msg.role==='assistant'?'left':'right'}`;
  const avatar=document.createElement('div');avatar.className='avatar';
  const avatarUrl=msg.role==='assistant'?c.linAvatar:c.myAvatar;
  if(avatarUrl)avatar.innerHTML=`<img src="${avatarUrl}">`;else avatar.textContent=msg.role==='assistant'?(c.partnerName||'言'):(c.myName||'我');
  avatar.addEventListener('click',()=>{if(msg.role==='assistant'){showToast('你','戳了戳'+(c.partnerName||'林言'),c.myAvatar);setTimeout(()=>{addMessage('user','(´つヮ⊂︎)');triggerAI()},500)}});
  const wrapper=document.createElement('div');wrapper.className='bubble-wrapper';
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=msg.content;
  wrapper.appendChild(bubble);
  if(msg.invite){
    const card=document.createElement('div');card.className='game-invite-card';
    card.innerHTML=`<div class="icon">🎮</div><div class="info"><div class="title">邀请你玩「${escapeHtml(msg.invite.title)}」</div><div class="desc">点击接受邀请</div></div>`;
    card.onclick=()=>{c.pendingInvite=msg.invite;saveState();addMessage('user','【我接受了邀请，准备开始玩「'+msg.invite.title+'」】');applyCustomStyle();openGamePanel(msg.invite.game)};
    wrapper.appendChild(card);
  }
  if(msg.role==='assistant'){
    const actions=document.createElement('div');actions.className='msg-actions';
    const eb=document.createElement('button');eb.textContent='编辑';
    eb.onclick=()=>{const nt=prompt('修改这条消息：',msg.content);if(nt!==null&&nt.trim()){msg.content=nt.trim();saveState();renderAllMessages()}};
    const rb=document.createElement('button');rb.textContent='重答';
    rb.onclick=()=>{c.memory.splice(index,1);saveState();renderAllMessages();triggerAI()};
    actions.appendChild(eb);actions.appendChild(rb);wrapper.appendChild(actions);
  }
  row.appendChild(avatar);row.appendChild(wrapper);chatArea.appendChild(row);
  setTimeout(()=>{if(msg.role==='assistant'){const bubbles=chatArea.querySelectorAll('.msg-row.left .bubble');if(bubbles.length>0){const lastBubble=bubbles[bubbles.length-1];if(/生气|哼|不理你|气死|罚|不许|管教你/.test(msg.content))lastBubble.classList.add('glow-red');else if(/想你|抱抱|亲亲|爱你|乖|宝贝/.test(msg.content))lastBubble.classList.add('glow-pink')}}},50);
}

function renderAllMessages(){
  const chatArea=document.getElementById('chatArea');chatArea.innerHTML='';
  const c=getCurrentChar();
  if(!c||!c.memory.length){chatArea.innerHTML='<div class="system-msg">还没有消息，直接发送消息或点击底部的🎮游戏开始玩吧</div>';return}
  c.memory.forEach((m,i)=>renderMessage(m,i));
  requestAnimationFrame(()=>{chatArea.scrollTop=chatArea.scrollHeight});
}

function addMessage(role,content,isHistorical=false,extras={}){
  const c=getCurrentChar();const time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});const ts=Date.now();
  const msg={role,content,time,timestamp:ts,...extras};
  c.memory.push(msg);if(c.memory.length>300)c.memory=c.memory.slice(-300);saveState();
  if(!isHistorical){renderMessage(msg,c.memory.length-1);document.getElementById('chatArea').scrollTop=999999}
  if(role==='assistant'){showToast(c.partnerName||c.name,content,c.linAvatar);
    if('Notification' in window&&Notification.permission==='granted'){try{new Notification(c.partnerName||c.name,{body:content,tag:'linyan'})}catch(e){}}}
  if(role==='assistant'){const mw=['流星','许愿','看星星','浪漫','流星雨','下雪'];if(mw.some(w=>content.includes(w)))triggerMeteorShower(8000)}
}

function buildPrompt(mode,extra=''){
  const now=new Date();const ts=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const wd=['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  const ds=`${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日`;
  const modeText=mode==='respond'?`芸熙刚刚对你说了话（见上一条 user 消息）。用你的方式回应她。`:`回顾我们的对话，判断是否想主动对芸熙说话。`;
  return `现在是${ds} ${ts}，${wd}。\n\n${modeText}${extra?'\n\n'+extra:''}\n\n发消息用 [SAY]你的话 格式，可拆成2-3条；不说话只回复 [PASS]。`;
}

async function callApi(messages){
  const c=getCurrentChar();if(!c.apiKey)throw new Error('未配置 API Key');
  const headers={'Content-Type':'application/json'};if(c.apiKey!=='proxy')headers['Authorization']='Bearer '+c.apiKey;
  const modelToUse=c.customModel&&c.customModel.trim()?c.customModel.trim():(c.model||'deepseek-chat');
  const resp=await fetch(c.apiUrl,{method:'POST',headers,body:JSON.stringify({model:modelToUse,messages,temperature:parseFloat(c.temperature)||0.9,max_tokens:600})});
  if(!resp.ok){const txt=await resp.text().catch(()=>'');throw new Error(`HTTP ${resp.status} ${txt.slice(0,100)}`)}
  const data=await resp.json();return data?.choices?.[0]?.message?.content||null;
}

async function think(mode='proactive',extra=''){
  if(state.busy)return;const c=getCurrentChar();
  state.busy=true;const sendBtn=document.getElementById('sendBtn');const statusBar=document.getElementById('statusBar');
  sendBtn.disabled=true;statusBar.classList.add('show');
  try{
    const prompt=buildPrompt(mode,extra);
    let sysContent=c.persona;
    if(c.longTermMemory&&c.longTermMemory.length){sysContent+='\n\n## 长期记忆（非常重要，请主动融入对话）\n';c.longTermMemory.forEach(m=>{sysContent+=`- ${m}\n`})}
    if(c.currentGame){sysContent+=`\n\n## 当前游戏状态\n${JSON.stringify(c.currentGame)}\n请根据游戏状态和你的性格自然回应，可以开玩笑、挑衅、或者装作输不起。`}
    const messages=[{role:'system',content:sysContent}];
    const recent=c.memory.slice(-15);
    for(const m of recent){if(m.role==='user'||m.role==='assistant')messages.push({role:m.role,content:m.content})}
    messages.push({role:'user',content:prompt});
    const reply=await callApi(messages);
    if(reply&&reply.includes('[SAY]')){
      const msgs=[];for(const line of reply.split('\n')){if(line.includes('[SAY]')){const m=line.split('[SAY]').pop().trim();if(m)msgs.push(m)}}
      for(let i=0;i<msgs.length;i++){addMessage('assistant',addKaomoji(msgs[i]));if(i<msgs.length-1)await new Promise(r=>setTimeout(r,1500+Math.random()*1500))}
      c.autoMemoryCount=(c.autoMemoryCount||0)+1;
      if(c.autoMemoryCount>=8){c.autoMemoryCount=0;extractMemory()}
      if(mode==='proactive'&&!c.pendingInvite&&Math.random()<0.5)sendGameInvite();
    }
  }catch(e){console.error(e);const chatArea=document.getElementById('chatArea');const errDiv=document.createElement('div');errDiv.className='system-msg';errDiv.textContent='发送失败：'+e.message;chatArea.appendChild(errDiv)}
  finally{state.busy=false;sendBtn.disabled=false;statusBar.classList.remove('show')}
}

const GAMES=[{id:'number_guess',title:'猜数字',icon:'🔢',desc:'1-100猜一个数'},{id:'rps',title:'猜拳',icon:'✊',desc:'石头剪刀布'},{id:'gomoku',title:'五子棋',icon:'⚫',desc:'9x9棋盘'},{id:'chess',title:'国际象棋',icon:'♟️',desc:'8x8棋盘演示'},{id:'monopoly',title:'大富翁',icon:'🎲',desc:'掷骰子走格子'},{id:'truth_dare',title:'真心话大冒险',icon:'💬',desc:'随机抽题'},{id:'fortune',title:'抽签',icon:'📿',desc:'求一支好签'}];
function sendGameInvite(){
  const g=GAMES[Math.floor(Math.random()*GAMES.length)];const c=getCurrentChar();
  c.pendingInvite={game:g.id,title:g.title};saveState();
  addMessage('assistant','想不想跟我玩个游戏？',false,{invite:{game:g.id,title:g.title}});
  applyCustomStyle();
}

let gameState=null;
function openGamePanel(gameId){document.getElementById('gamePanel').classList.add('show');if(gameId)startGame(gameId);else renderGameMenu()}
function closeGamePanel(){document.getElementById('gamePanel').classList.remove('show');gameState=null;const img=document.getElementById('gameAvatar');if(img)img.src='avatar_normal.png'}
function setAvatar(src){const img=document.getElementById('gameAvatar');if(img)img.src=src||'avatar_normal.png'}

function renderGameMenu(){
  const area=document.getElementById('gameArea');document.getElementById('gameTitle').textContent='游戏大厅';document.getElementById('gameHint').textContent='选一个游戏和林言一起玩吧～';
  area.innerHTML='';area.style.display='flex';const row=document.createElement('div');row.className='game-row';
  GAMES.forEach(g=>{const card=document.createElement('div');card.className='game-card';card.innerHTML=`<div class="icon">${g.icon}</div><div class="name">${g.name}</div><div style="font-size:11px;color:var(--modal-label)">${g.desc}</div>`;card.onclick=()=>startGame(g.id);row.appendChild(card)});
  area.appendChild(row);setAvatar('avatar_happy.png');
}

function startGame(id){
  const area=document.getElementById('gameArea');const g=GAMES.find(x=>x.id===id);
  document.getElementById('gameTitle').textContent=g.icon+' '+g.title;document.getElementById('gameHint').textContent='开始玩吧！';
  area.innerHTML='';area.style.display='flex';setAvatar('avatar_happy.png');

  if(id==='number_guess'){
    const target=Math.floor(Math.random()*100)+1;let tries=0;
    const input=document.createElement('input');input.type='number';input.style.cssText='width:120px;text-align:center;font-size:24px;padding:12px;border-radius:12px;border:1px solid var(--border-color);background:var(--modal-input-bg);color:var(--modal-text)';
    const btn=document.createElement('button');btn.className='game-btn';btn.textContent='猜';
    const log=document.createElement('div');log.style.cssText='text-align:center;font-size:13px;margin-top:10px';
    btn.onclick=()=>{const v=parseInt(input.value);if(!v)return;tries++;
      if(v===target){log.textContent=`🎉 猜中了！你用了 ${tries} 次。`;setAvatar('avatar_sad.png');getCurrentChar().currentGame={game:'猜数字',result:'玩家猜中',answer:target,tries};sendGameResultToAI(`【游戏结果】我猜中了数字 ${target}，共猜了 ${tries} 次。请按你的性格回应我。`);input.disabled=true;btn.disabled=true}
      else{log.textContent=v<target?`小了，再大一点（已猜 ${tries} 次）`:`大了，再小一点（已猜 ${tries} 次）`;input.value='';sendGameResultToAI(`【游戏动作】我猜了 ${v}，提示是${v<target?'小了':'大了'}。`)}
    };
    area.appendChild(input);area.appendChild(btn);area.appendChild(log);
  }

  if(id==='rps'){
    const row=document.createElement('div');row.className='game-row';
    ['石头','剪刀','布'].forEach(choice=>{const btn=document.createElement('button');btn.className='game-btn secondary';btn.textContent=choice;
      btn.onclick=()=>{const aiChoice=['石头','剪刀','布'][Math.floor(Math.random()*3)];let result='';if(choice===aiChoice)result='平局';else if((choice==='石头'&&aiChoice==='剪刀')||(choice==='剪刀'&&aiChoice==='布')||(choice==='布'&&aiChoice==='石头'))result='你赢';else result='林言赢';
        area.innerHTML='';const emoji={石头:'✊',剪刀:'✌️',布:'✋'};area.innerHTML=`<div style="font-size:40px;text-align:center">${emoji[choice]} VS ${emoji[aiChoice]}</div>`;
        const res=document.createElement('div');res.style.textAlign='center';res.textContent=`你出了「${choice}」，林言出了「${aiChoice}」 → ${result}`;area.appendChild(res);
        if(result==='你赢')setAvatar('avatar_sad.png');else if(result==='林言赢')setAvatar('avatar_happy.png');else setAvatar('avatar_normal.png');
        const again=document.createElement('button');again.className='game-btn';again.textContent='再来一局';again.onclick=()=>startGame('rps');area.appendChild(again);
        getCurrentChar().currentGame={game:'猜拳',myChoice:choice,aiChoice,result};sendGameResultToAI(`【游戏结果】猜拳：我出了「${choice}」，你出了「${aiChoice}」，结果是「${result}」。请按你的性格回应我。`)
      };row.appendChild(btn)});
    area.appendChild(row);
  }

  if(id==='gomoku'){
    const size=9;const board=Array.from({length:size},()=>Array(size).fill(0));
    const boardDiv=document.createElement('div');boardDiv.className='board';boardDiv.style.gridTemplateColumns=`repeat(${size},1fr)`;boardDiv.style.width='92%';boardDiv.style.maxWidth='380px';
    for(let i=0;i<size;i++)for(let j=0;j<size;j++){
      const cell=document.createElement('div');cell.className='board-cell';cell.dataset.r=i;cell.dataset.c=j;
      cell.onclick=()=>{if(board[i][j]!==0)return;board[i][j]=1;cell.textContent='⚫';
        sendGameResultToAI(`【游戏动作】我在 (${i},${j}) 下了一颗黑子。现在轮到你了，别放水。`);
        if(checkGomokuWin(board,1)){setAvatar('avatar_happy.png');sendGameResultToAI('【游戏结果】五子棋：我连成五子了，我赢了！请按你的性格回应我。');return}
        setTimeout(()=>{const empty=[];for(let a=0;a<size;a++)for(let b=0;b<size;b++)if(board[a][b]===0)empty.push([a,b]);if(!empty.length)return;
          const [r,c]=empty[Math.floor(Math.random()*empty.length)];board[r][c]=2;const ac=document.querySelector(`.board-cell[data-r="${r}"][data-c="${c}"]`);if(ac)ac.textContent='⚪';
          if(checkGomokuWin(board,2)){setAvatar('avatar_sad.png');sendGameResultToAI('【游戏结果】五子棋：林言连成五子，我输了。请按你的性格回应我。')}},400)};
      boardDiv.appendChild(cell);
    }
    area.appendChild(boardDiv);
  }

  if(id==='chess'){
    const boardDiv=document.createElement('div');boardDiv.className='board';boardDiv.style.gridTemplateColumns='repeat(8,1fr)';boardDiv.style.width='92%';boardDiv.style.maxWidth='380px';
    const back=['♜','♞','♝','♛','♚','♝','♞','♜'];
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
      const cell=document.createElement('div');cell.className='board-cell';
      if(r===0)cell.textContent=back[c];else if(r===1)cell.textContent='♟';else if(r===6)cell.textContent='♙';else if(r===7)cell.textContent=['♖','♘','♗','♕','♔','♗','♘','♖'][c];
      cell.onclick=()=>{document.querySelectorAll('.board-cell').forEach(x=>x.style.outline='none');if(cell.textContent){cell.style.outline='2px solid var(--accent)';gameState={selected:[r,c]}}else if(gameState&&gameState.selected){const from=document.querySelector(`.board-cell[data-cr="${gameState.selected[0]}"][data-cc="${gameState.selected[1]}"]`);if(from){cell.textContent=from.textContent;from.textContent='';gameState.selected=null;sendGameResultToAI(`【游戏动作】国际象棋：我移动了一颗棋子到 (${r},${c})。`)}}};
      cell.dataset.cr=r;cell.dataset.cc=c;boardDiv.appendChild(cell);
    }
    area.appendChild(boardDiv);const hint=document.createElement('div');hint.style.cssText='font-size:12px;color:var(--modal-label);text-align:center;margin-top:8px';hint.textContent='点击棋子选中，再点空格移动（演示版）';area.appendChild(hint);
  }

  if(id==='monopoly'){
    const boardDiv=document.createElement('div');boardDiv.className='monopoly-board';
    const labels=['起点','地产1','机会','地产2','地产3','地产4','机会','地产5','地产6','地产7','机会','地产8','地产9','地产10','机会','地产11','地产12','地产13','机会','终点'];

    area.appendChild(rollBtn);const c=getCurrentChar();if(c.monoPos)document.getElementById('mono-'+c.monoPos).classList.add('active');
  }

  if(id==='truth_dare'){
    const btn=document.createElement('button');btn.className='game-btn';btn.textContent='抽！';
    const log=document.createElement('div');log.style.cssText='text-align:center;font-size:14px;line-height:1.6';

      log.innerHTML=`<b>${isTruth?'💬 真心话':'🔥 大冒险'}：</b>${pick}`;btn.textContent='换一个';setAvatar('avatar_happy.png');
      getCurrentChar().currentGame={game:'真心话大冒险',type:isTruth?'真心话':'大冒险',question:pick};sendGameResultToAI(`【游戏结果】我们玩真心话大冒险，我抽到了${isTruth?'真心话':'大冒险'}：${pick}。请按你的性格回应我，可以追问或调侃我。`)};
    area.appendChild(btn);area.appendChild(log);
  }

  if(id==='fortune'){
    const btn=document.createElement('button');btn.className='game-btn';btn.textContent='📿 抽签';
    const log=document.createElement('div');log.style.cssText='text-align:center;font-size:18px;line-height:1.6';

    area.appendChild(btn);area.appendChild(log);
  }
}

function checkGomokuWin(board,player){const size=9;for(let i=0;i<size;i++)for(let j=0;j<size;j++){if(board[i][j]!==player)continue;
  if(j<=size-5&&board[i][j+1]===player&&board[i][j+2]===player&&board[i][j+3]===player&&board[i][j+4]===player)return true;
  if(i<=size-5&&board[i+1][j]===player&&board[i+2][j]===player&&board[i+3][j]===player&&board[i+4][j]===player)return true;
  if(i<=size-5&&j<=size-5&&board[i+1][j+1]===player&&board[i+2][j+2]===player&&board[i+3][j+3]===player&&board[i+4][j+4]===player)return true;
  if(i<=size-5&&j>=4&&board[i+1][j-1]===player&&board[i+2][j-2]===player&&board[i+3][j-3]===player&&board[i+4][j-4]===player)return true}return false}

function addKaomoji(text){const c=getCurrentChar();if(!c.kaomojiEnabled)return text;const freqMap={low:0.05,medium:0.2,high:0.5};const chance=freqMap[c.kaomojiFreq]??0.05;if(Math.random()>chance)return text;const strictWords=['谁','干嘛','干什么','解释','说清楚','生气','不行','不许','错','过来','问','骗','瞒','是不是'];if(strictWords.some(w=>text.includes(w)))return text;return text+KAOMOJI_LIST[Math.floor(Math.random()*KAOMOJI_LIST.length)]}

async function triggerAI(){clearTimeout(state.timer);await think('respond');scheduleNext()}
function scheduleNext(){clearTimeout(state.timer);if(!state.running)return;const c=getCurrentChar();const minMs=Math.max(1,c.thinkMin)*60000;const maxMs=Math.max(c.thinkMin,c.thinkMax)*60000;const delay=minMs+Math.random()*(maxMs-minMs);state.timer=setTimeout(async()=>{await think('proactive');scheduleNext()},delay)}
function startAuto(){state.running=true;const btn=document.getElementById('toggleAutoBtn');btn.classList.add('active');btn.textContent='⏸ 自动';if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});scheduleNext()}
function stopAuto(){state.running=false;const btn=document.getElementById('toggleAutoBtn');btn.classList.remove('active');btn.textContent='▶ 自动';clearTimeout(state.timer)}

async function extractMemory(){
  const c=getCurrentChar();if(c.memory.length<4)return;const recentChat=c.memory.slice(-10).map(m=>`${m.role==='user'?'芸熙':c.name}: ${m.content}`).join('\n');
  const modelToUse=c.customModel&&c.customModel.trim()?c.customModel.trim():(c.model||'deepseek-chat');
  try{const resp=await fetch(c.apiUrl,{method:'POST',headers:{'Content-Type':'application/json',...(c.apiKey!=='proxy'?{'Authorization':'Bearer '+c.apiKey}:{})},body:JSON.stringify({model:modelToUse,messages:[{role:'system',content:'你是一个记忆提取助手。从下面的对话中提取值得长期记住的关于芸熙的信息（比如喜好、习惯、重要事件）。每条一行，不带序号，只输出记忆内容。如果没有值得记住的，输出：NONE。'},{role:'user',content:recentChat}],temperature:0.3,max_tokens:300})});
    const data=await resp.json();const text=data?.choices?.[0]?.message?.content||'';
    if(text&&text.trim()!=='NONE'){const lines=text.split('\n').map(l=>l.replace(/^[-•\d.\s]+/,'').trim()).filter(Boolean);c.longTermMemory=c.longTermMemory||[];lines.forEach(l=>{if(!c.longTermMemory.includes(l))c.longTermMemory.push(l)});if(c.longTermMemory.length>50)c.longTermMemory=c.longTermMemory.slice(-50);saveState();renderMemoryList()}
  }catch(e){console.warn('记忆提取失败',e)}
}

function triggerMeteorShower(duration=6000){
  const container=document.createElement('div');container.className='meteor-shower-container';document.body.appendChild(container);
  const endTime=Date.now()+duration;
  const interval=setInterval(()=>{if(Date.now()>endTime){clearInterval(interval);setTimeout(()=>container.remove(),3000);return}
    const meteor=document.createElement('div');meteor.className='meteor';
    const startX=Math.random()*100;const startY=-10-Math.random()*20;const size=0.5+Math.random()*1.5;const speed=1.5+Math.random()*2.5;
    meteor.style.left=startX+'vw';meteor.style.top=startY+'vh';meteor.style.animationDuration=speed+'s';meteor.style.transform=`scale(${size}) rotate(-45deg)`;
    if(Math.random()>0.6)meteor.style.filter='blur(1px)';if(Math.random()>0.8)meteor.style.filter='blur(2px)';
    container.appendChild(meteor);setTimeout(()=>meteor.remove(),speed*1000);
  },150);
}

function compressImage(file,maxW=800,maxH=800,quality=0.8){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.readAsDataURL(file);reader.onload=e=>{const img=new Image();img.src=e.target.result;img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>maxW){h=Math.round(h*maxW/w);w=maxW}else if(h>w&&h>maxH){w=Math.round(w*maxH/h);h=maxH}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality))};img.onerror=reject};reader.onerror=reject})}
